# Local developer commands for Caerbannog.
#
# Requires go-task (https://taskfile.dev) installed separately:
#   - Fedora: `sudo dnf install go-task` (binary is `go-task`; optionally `alias task=go-task`)
#   - macOS:  `brew install go-task` (binary is `task`)
# Each task below is a thin wrapper around an existing `./gradlew` or compose command - no logic lives here,
# it only shortens what a developer has to type. See docs/tasks/M1-TASKFILE-01-local-dev-commands.md and M2-15.
version: '3'

vars:
  CONTAINER_ENGINE: '{{.CONTAINER_ENGINE | default (ternary "podman" "docker" (eq OS "linux"))}}'

tasks:
  test:
    desc: Run the fast test suite across all modules (no container engine required).
    cmds:
      - ./gradlew test

  test:broker:
    desc: Run the @broker test suite (uses rootless Podman socket when present, or Docker).
    cmds:
      - ./gradlew :data-rabbit:brokerTest

  test:broker:podman:
    desc: Run the @broker test suite explicitly against rootless Podman (requires `systemctl --user start podman.socket`).
    cmds:
      - ./gradlew :data-rabbit:brokerTest -PcontainerEngine=podman

  test:broker:docker:
    desc: Run the @broker test suite explicitly against Docker.
    cmds:
      - ./gradlew :data-rabbit:brokerTest -PcontainerEngine=docker

  test:keychain:
    desc: Run the real OS keychain tests (touches the real keychain and may prompt; run on demand).
    cmds:
      - ./gradlew :data-rabbit:keychainTest

  test:screenshots:
    desc: Write Connections screen screenshots to ui/build/screenshots/ (compare by eye with docs/ux/Main.dc.html).
    cmds:
      - ./gradlew :ui:screenshotTest

  run:
    desc: Launch the desktop app.
    cmds:
      - ./gradlew :desktopApp:run

  package:dmg:
    desc: Build the macOS .dmg installer.
    cmds:
      - ./gradlew :desktopApp:packageDmg

  package:msi:
    desc: Build the Windows .msi installer (cannot be cross-built from macOS/Linux).
    cmds:
      - ./gradlew :desktopApp:packageMsi

  # M2-12 / M2-15: local development broker (developer tooling, see dev/README.md). Throwaway secrets only.
  # Defaults to `podman compose` on Linux and `docker compose` on macOS/Windows; pass `CONTAINER_ENGINE=podman|docker` or use `:podman` / `:docker` tasks to override.
  dev:up:
    desc: "Start the local dev RabbitMQ via {{.CONTAINER_ENGINE}} compose (default: podman on Linux, docker on macOS/Windows) and wait until it is healthy."
    cmds:
      - '{{.CONTAINER_ENGINE}} compose -f dev/broker/docker-compose.yml up -d --wait'

  dev:up:podman:
    desc: "Start the local dev RabbitMQ explicitly with podman compose and wait until it is healthy."
    cmds:
      - podman compose -f dev/broker/docker-compose.yml up -d --wait

  dev:up:docker:
    desc: "Start the local dev RabbitMQ explicitly with docker compose and wait until it is healthy."
    cmds:
      - docker compose -f dev/broker/docker-compose.yml up -d --wait

  dev:seed:
    silent: true # task would echo the command line, which holds the password
    desc: "Publish messages into the dev streams. Example: task dev:seed -- --password dev-password [--queues 1000 --vhost many] [--hold]. --hold keeps a named publisher and consumer per stream connected until Ctrl+C"
    cmds:
      - ./gradlew -q :dev-seed:run --args="--ca data-rabbit/src/test/resources/tls/ca.pem {{.CLI_ARGS}}"

  dev:seed:plain:
    silent: true # task would echo the command line, which holds the password
    desc: "Like dev:seed but without TLS (stream 5552, management 15672, no CA). --hold keeps a named publisher and consumer per stream connected until Ctrl+C. Example: task dev:seed:plain -- --password dev-password"
    cmds:
      - ./gradlew -q :dev-seed:run --args="--no-tls {{.CLI_ARGS}}"

  dev:reset:
    desc: "Remove the dev broker and its volume via {{.CONTAINER_ENGINE}} compose (default: podman on Linux, docker on macOS/Windows), then start it again."
    cmds:
      - '{{.CONTAINER_ENGINE}} compose -f dev/broker/docker-compose.yml down -v'
      - '{{.CONTAINER_ENGINE}} compose -f dev/broker/docker-compose.yml up -d --wait'

  dev:reset:podman:
    desc: Remove the dev broker and its volume with `podman compose`, then start it again.
    cmds:
      - podman compose -f dev/broker/docker-compose.yml down -v
      - podman compose -f dev/broker/docker-compose.yml up -d --wait

  dev:reset:docker:
    desc: Remove the dev broker and its volume with `docker compose`, then start it again.
    cmds:
      - docker compose -f dev/broker/docker-compose.yml down -v
      - docker compose -f dev/broker/docker-compose.yml up -d --wait
