# Local developer commands for Caerbannog.
#
# Requires go-task (https://taskfile.dev) installed separately, e.g. `brew install go-task` on macOS.
# Each task below is a thin wrapper around an existing `./gradlew` command - no logic lives here, it
# only shortens what a developer has to type. See docs/tasks/M1-TASKFILE-01-local-dev-commands.md.
version: '3'

tasks:
  test:
    desc: Run the fast test suite across all modules (no Docker required).
    cmds:
      - ./gradlew test

  test:broker:
    desc: Run the Docker-dependent @broker test suite (needs Docker Desktop running).
    cmds:
      - ./gradlew :data-rabbit:brokerTest

  test:keychain:
    desc: Run the real OS keychain tests (touches the real keychain and may prompt; run on demand).
    cmds:
      - ./gradlew :data-rabbit:keychainTest

  test:screenshots:
    desc: Write Connections screen screenshots to ui/build/screenshots/ (compare by eye with docs/ux/Main.dc.html).
    cmds:
      - ./gradlew :ui:screenshotTest

  run:
    desc: Launch the desktop app.
    cmds:
      - ./gradlew :desktopApp:run

  package:dmg:
    desc: Build the macOS .dmg installer.
    cmds:
      - ./gradlew :desktopApp:packageDmg

  package:msi:
    desc: Build the Windows .msi installer (cannot be cross-built from macOS).
    cmds:
      - ./gradlew :desktopApp:packageMsi

  # M2-12: local development broker (developer tooling, see dev/README.md). Throwaway secrets only.
  dev:up:
    desc: Start the local dev RabbitMQ (TLS and plain listeners, streams, known topology) and wait until it is healthy.
    cmds:
      - docker compose -f dev/broker/docker-compose.yml up -d --wait

  dev:seed:
    silent: true # task would echo the command line, which holds the password
    desc: "Publish messages into the dev streams. Example: task dev:seed -- --password dev-password [--queues 1000 --vhost many]"
    cmds:
      - ./gradlew -q :dev-seed:run --args="--ca data-rabbit/src/test/resources/tls/ca.pem {{.CLI_ARGS}}"

  dev:seed:plain:
    silent: true # task would echo the command line, which holds the password
    desc: "Like dev:seed but without TLS (stream 5552, management 15672, no CA). Example: task dev:seed:plain -- --password dev-password"
    cmds:
      - ./gradlew -q :dev-seed:run --args="--no-tls {{.CLI_ARGS}}"

  dev:reset:
    desc: Remove the dev broker and its volume, then start it again (topology is re-applied from dev/broker/definitions).
    cmds:
      - docker compose -f dev/broker/docker-compose.yml down -v
      - docker compose -f dev/broker/docker-compose.yml up -d --wait
