name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # M2-19: only the floating-image job below runs on this schedule; the other jobs keep their own `if`.
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  # The weekly schedule run gets its own group, so it can never replace a queued push run on main (workflow_dispatch
  # shares the push group, as before).
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' }}
  # Only superseded pull request runs are cancelled; every run on main finishes so it gives a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Fast tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # Compose UI tests need a display; xvfb provides one on the headless runner.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Two steps with their own timeouts: if something hangs, the log shows which half. The first step names the
      # module test tasks (not `test -x :ui:jvmTest`): the root `test` also runs verifyTestDiscovery, which fails
      # when the UI results are missing. The second step runs root `test`: the modules above are up to date, the UI
      # tests run under xvfb and the discovery guard then checks every module.
      - name: Run tests except the Compose UI tests (no containers, no keychain)
        timeout-minutes: 25
        run: ./gradlew :core:test :core-testing:test :data-rabbit:test :mcp-server:test :desktopApp:test :acceptance-tests:test :dev-seed:test --console=plain
      - name: Run the Compose UI tests and the test discovery guard
        timeout-minutes: 25
        run: xvfb-run -a ./gradlew test --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  broker-tests:
    name: Live broker tests
    # Real RabbitMQ in Testcontainers (Docker is preinstalled on the runner). Only on main and on demand: slower than the fast suite.
    if: github.event_name == 'workflow_dispatch' || (github.event_name != 'schedule' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # M2-18: sum of the two step limits (25 + 45) plus 10 for checkout, Gradle setup, the dev broker and teardown.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # Some gate tests (RealBrokerM5GateTest, RealBrokerMqttIntegrationTest) talk to the local dev broker on localhost,
      # as `task dev:up` starts it; the other broker tests start their own Testcontainers broker.
      - name: Start the dev broker
        run: docker compose -f dev/broker/docker-compose.yml up -d --wait
      # M2-18: two halves. Limits = the Gradle task timeouts in the root build.gradle.kts (measured CI time x 1.5).
      - name: Run regression broker tests
        timeout-minutes: 25
        run: ./gradlew :data-rabbit:brokerTest
      # always(): a red regression half still runs the spike half, so both verdicts show.
      - name: Run spike broker tests
        if: always()
        timeout-minutes: 45
        run: ./gradlew :data-rabbit:brokerSpikeTest
      - name: Stop the dev broker
        if: always()
        run: docker compose -f dev/broker/docker-compose.yml down -v
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: broker-test-reports
          path: data-rabbit/build/reports/tests/

  # M2-19: early warning only. The blocking jobs run on the pinned images; this one asks what the floating 4.x tag does.
  # continue-on-error: a red result shows a mark and a report but blocks nobody. The spike half is not run here (its
  # ladder images are fixed). Never on push or pull_request.
  floating-broker-tests:
    name: Live broker tests on the floating 4.x image
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    # Regression half limit (25) plus 10 for checkout, Gradle setup, the dev broker and teardown.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # The dev-broker gates talk to localhost; the dev broker stays on its pinned tag, only CURRENT_4X floats.
      - name: Start the dev broker
        run: docker compose -f dev/broker/docker-compose.yml up -d --wait
      - name: Run regression broker tests on the floating 4.x image
        timeout-minutes: 25
        run: ./gradlew :data-rabbit:brokerTest -PbrokerImage=rabbitmq:4-management
      - name: Stop the dev broker
        if: always()
        run: docker compose -f dev/broker/docker-compose.yml down -v
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: floating-broker-test-reports
          path: data-rabbit/build/reports/tests/
          if-no-files-found: ignore
