name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded pull request runs are cancelled; every run on main finishes so it gives a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Compose UI tests need a display; xvfb provides one on the headless runner.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Two steps with their own timeouts: if something hangs, the log shows which half.
      - name: Run tests except the Compose UI tests (no containers, no keychain)
        timeout-minutes: 25
        run: ./gradlew test -x :ui:jvmTest --console=plain
      - name: Run the Compose UI tests
        timeout-minutes: 25
        run: xvfb-run -a ./gradlew :ui:jvmTest --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  broker-tests:
    name: Live broker tests
    # Real RabbitMQ in Testcontainers (Docker is preinstalled on the runner). Only on main and on demand: slower than the fast suite.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Some gate tests (RealBrokerM5GateTest, RealBrokerMqttIntegrationTest) talk to the local dev broker on localhost,
      # as `task dev:up` starts it; the other broker tests start their own Testcontainers broker.
      - name: Start the dev broker
        run: docker compose -f dev/broker/docker-compose.yml up -d --wait
      - name: Run broker tests
        run: ./gradlew :data-rabbit:brokerTest
      - name: Stop the dev broker
        if: always()
        run: docker compose -f dev/broker/docker-compose.yml down -v
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-test-reports
          path: data-rabbit/build/reports/tests/
