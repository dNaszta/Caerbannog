# M1-02: throwaway TLS config for RealBrokerReachabilityTest's Testcontainers RabbitMQ instance.
# Certs are copied into the container at /etc/rabbitmq/tls/ (see that test's container setup);
# ca.pem/server.pem/server.key here are a throwaway self-signed CA and server cert generated purely
# for this test fixture (see this task's handover notes for how they were generated) - never use them
# for anything real.
#
# AMQP 0-9-1 TLS (also reused by the stream protocol's TLS settings below).
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile = /etc/rabbitmq/tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# Stream protocol over TLS, port 5551 - docs/spec.md "Architecture" default.
stream.listeners.ssl.default = 5551

# Management API over HTTPS, port 15671 - docs/spec.md "Architecture" default.
management.ssl.port = 15671
management.ssl.cacertfile = /etc/rabbitmq/tls/ca.pem
management.ssl.certfile = /etc/rabbitmq/tls/server.pem
management.ssl.keyfile = /etc/rabbitmq/tls/server.key
