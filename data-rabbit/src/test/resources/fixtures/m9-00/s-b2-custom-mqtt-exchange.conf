# M9-00a spike S-B2: throwaway broker whose MQTT plugin uses the exchange custom.mqtt instead of amq.topic.
# Plain listeners as the image defaults have them (stream 5552, management 15672, MQTT 1883); the guest user logs in as in the other spikes.
mqtt.exchange = custom.mqtt
mqtt.listeners.tcp.default = 1883
stream.listeners.tcp.default = 5552
management.tcp.port = 15672
