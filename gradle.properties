# M2-15: Heap sizing for the Gradle and Kotlin compiler daemons.
# Prevents OutOfMemoryError: Java heap space in the Kotlin compiler daemon during full multi-module
# builds (`--rerun-tasks`) on high-core developer workstations (e.g. 32-thread Fedora 45).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx2g
