# M2-12 / M2-15: local development broker (developer tooling, not part of the product). Throwaway secrets only.
# TLS on 5551 (stream), 15671 (management) and 5671 (AMQP), the default. Plain (not encrypted) 5552 (stream) and
# 15672 (management) are published too, for the app's "TLS off" profile and `dev-seed --no-tls`.
# The CA, server certificate, key and listener config are the test fixtures in data-rabbit/src/test/resources/tls,
# mounted read-only with `:ro,z` so SELinux Enforcing (Fedora) allows rootless Podman containers to read them.
# Reset: podman compose (or docker compose) -f dev/broker/docker-compose.yml down -v, then up -d --wait.
name: caerbannog-dev
services:
  rabbitmq:
    image: docker.io/library/rabbitmq:4.4.1-management
    container_name: caerbannog-dev-rabbitmq
    ports:
      - "5551:5551"
      - "15671:15671"
      - "5671:5671"
      - "5552:5552"
      - "15672:15672"
      - "1883:1883"
      - "8883:8883"
    # M8 hand trial: lets the Shovel plugin on this broker reach the 3.x dev broker (dev/broker-3x) through the host's
    # published port as host.docker.internal:5673. Docker Desktop has the name already; on Linux this adds it.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../../data-rabbit/src/test/resources/tls/rabbitmq.conf:/etc/rabbitmq/conf.d/90-tls.conf:ro,z
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/91-definitions.conf:ro,z
      - ../../data-rabbit/src/test/resources/tls/ca.pem:/etc/rabbitmq/tls/ca.pem:ro,z
      - ../../data-rabbit/src/test/resources/tls/server.pem:/etc/rabbitmq/tls/server.pem:ro,z
      - ../../data-rabbit/src/test/resources/tls/server.key:/etc/rabbitmq/tls/server.key:ro,z
      - ./definitions:/etc/rabbitmq/definitions:ro,z
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro,z
    healthcheck:
      # Run as `rabbitmq` via `gosu` so Podman's root healthcheck probe at startup cannot create a
      # root-owned /var/lib/rabbitmq/.erlang.cookie before docker-entrypoint.sh switches to `rabbitmq`.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
volumes:
  rabbitmq-data:
